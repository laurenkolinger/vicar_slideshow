# ==============================================================================
# MODULE INTERFACE DEFINITION: VICAR Lab Showcase
# ==============================================================================
# A resource / viewer module (NOT a data-processing stage). It shows the VICAR
# Lab screensaver and slideshow as pop-out windows inside VICARIUS and lets you
# add media from the UI. The slides and captions live in a content folder named
# by settings.json, outside the repository; `showcase.py check --json` reports
# that folder to the UI. No data-dictionary outputs, no runner, no CLI form.
# Rendering is driven by `ui.style: showcase` (see module_views.py).
# ==============================================================================

name: "vicar_slideshow"
display_name: "VICAR Lab Showcase"           # short title on the UI card; REQUIRED
tags: ["MISC"]                               # filter tag; this is a misc resource, not a pipeline
hidden: false
hidden_reason: ""
version: "2.0.0"                             # 2.0.0: the content folder moved out of the repository
description: "VICAR Lab screensaver and slideshow. Opens a full-screen showcase of lab imagery and video from a content folder named in settings.json, or adds new media to that folder from the UI."
author: "Lauren Olinger"
created: "2026-05-21"

# Classification: viewer/resource, not a data pipeline stage.
type: "resource"

# No data inputs/outputs: this module does not produce dictionary-bound
# datasets, so there is deliberately NO EML/sidecar contract here.
inputs: []
outputs: []

# ------------------------------------------------------------------------------
# VICARIUS UI: showcase style
# ------------------------------------------------------------------------------
# `style: showcase` tells module_views.py to render templates/module_showcase.html
# instead of the generic runner form. Each view runs on its own server, started
# with `serve_cmd` from the repository root, so a running view survives VICARIUS
# restarts. `content_cmd` prints the content folder report (slides, thumbnails,
# warnings) as JSON; the card reads the reel from it and writes uploads there.
ui:
  style: showcase
  bundle_dir: "slideshow"                          # github_repo/<bundle_dir>/ holds the pages
  content_cmd: ["showcase.py", "check", "--json"]  # reports the content folder named by settings.json
  views:
    - key: "screensaver"
      label: "Open Screensaver"
      file: "screensaver.html"
      detached: true
      port: 8766
      serve_cmd: ["showcase.py", "serve", "--view", "screensaver", "--port", "8766"]
      help: "Click to open the auto-scrolling full-screen reel from the content folder named in settings.json; move the mouse, click or press any key to exit, and use Up and Down to dim or brighten it. The reel runs on its own server (port 8766), so it keeps running when VICARIUS restarts."
    - key: "slideshow"
      label: "Open Slideshow"
      file: "slideshow.html"
      detached: true
      port: 8765
      serve_cmd: ["showcase.py", "serve", "--view", "slideshow", "--port", "8765"]
      help: "Click to open the manual slideshow and grid from the content folder named in settings.json; Space toggles the grid, the arrow keys change slides and F toggles full screen. The slideshow runs on its own server (port 8765), so it keeps running when VICARIUS restarts."
